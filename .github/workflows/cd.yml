# Runs CI, then publishes the image through publish.yml. Pushes to main
# publish the main tag. Version tags pushed by hand (v1.2.3) publish 1.2.3,
# 1.2, and latest. Releases normally come from release.yml, which publishes
# its own images because a tag it creates doesn't start this workflow.
name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      release: ${{ startsWith(github.ref, 'refs/tags/v') }}
      version: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
