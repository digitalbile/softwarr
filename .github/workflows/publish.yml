# Builds the image for amd64 and arm64 and publishes it to
# ghcr.io/<owner>/softwarr. Called by cd.yml and release.yml.
#
# A release (release: true) publishes the version (1.2.3), the minor line
# (1.2), and latest. Otherwise the branch name is published (main).
name: Publish

on:
  workflow_call:
    inputs:
      version:
        description: Version built into the binary, such as v1.2.3. Empty means git describe.
        type: string
        default: ""
      release:
        description: Publish the version tags and latest instead of the branch tag.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags, so git describe gives the same version as make.
          fetch-depth: 0
      - id: version
        env:
          VERSION: ${{ inputs.version }}
        run: echo "version=${VERSION:-$(git describe --tags --always)}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # The version comes from the input, not the git ref, because a
          # release run starts from main before its tag exists.
          tags: |
            type=ref,event=branch,enable=${{ !inputs.release }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.release }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.release }}
          flavor: |
            latest=${{ inputs.release }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
